<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Checker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript Core CSS and JavaScript CDN Resources -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- External CSS Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="element-body">

    <!-- Header / Navigation (Unchanged) -->
    <header class="navbar-custom">
        <div style="display: flex;">
            <a href="homepage.html" class="nav-box">Homepage</a>
            <a href="elementchecker.html" class="nav-box">Element Checker</a>
            <a href="schoolclubmembers.html" class="nav-box">School Club Members</a>
            <a href="meetthecreator.html" class="nav-box">Meet The Creator</a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="element-wrapper">
        <div class="element-outer-card">
            <h1>Non-metal Elements</h1>
            <p class="element-subtitle">Periodic Table Information Finder</p>
            
            <p class="element-instructions">
                <b>Instructions:</b> Enter the symbol of a non-metal element (Ex: H, S, O, Ne)
            </p>

            <div class="element-inner-card">
                <label class="element-input-label" for="symbol_input"><b>🔍 Element Symbol:</b></label>
                <input type="text" id="symbol_input" class="element-text-input" placeholder="Search">

                <button type="button" class="element-btn" py-click="check_element">Check Details</button>

                <div class="element-result-label"><b>! Results:</b></div>
                <div id="element-output"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Footer Bar (Unchanged) -->
    <footer class="footer-bar">
         GRADE 10-SAPPHIRE | JUDE T. YUNUS | ICT Q2 PROJECT ©2026
    </footer>

    <!-- PyScript Python Script Binding -->
    <script type="py" src="main.py"></script>
</body>
</html>
